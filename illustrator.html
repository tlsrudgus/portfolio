<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신경현 포트폴리오</title>
  <link href="images/favicon.ico" rel="icon">
  <link href="css/style.css" rel="stylesheet">
  <script defer src="js/script.js"></script>
</head>
<body>
  <main id="illustrator">
    <a class="re-btn" href="index.html">&larr; </a>
    <section class="logo">
      <div class="container">
        <h1>로고</h1>
        <div class="box-group">
          <div class="box">
            <h2>레스토랑 로고</h2>
            <img data-src="images/logoL1.jpg" src="images/logo1.png" alt="로고1">
          </div>
          <div class="box">
            <h2>AI가 제시한 로고 제작</h2>
            <img data-src="images/logoL2.png" src="images/logo2.png" alt="로고2">
          </div>
          <div class="box">
            <h2>어도비 프로그램 로고 리뉴얼</h2>
            <img data-src="images/logoL3.jpg" src="images/logo3.png" alt="로고3">
          </div>
        </div>
      </div>
    </section>
    <section class="character">
      <div class="container">
        <h1>캐릭터</h1>
        <div class="box-group">
          <div class="box">
            <h2>펭귄</h2>
            <img data-src="images/charL1.jpg" src="images/character1.png" alt="캐릭터1">
          </div>
          <div class="box">
            <h2>아이</h2>
            <img data-src="images/charL2.jpg" src="images/character2.png" alt="캐릭터2">
          </div>
          <div class="box">
            <h2>펠리컨</h2>
            <img data-src="images/charL3.jpg" src="images/character3.png" alt="캐릭터3">
          </div>
          <div class="box">
            <h2>정장입은 사람</h2>
            <img data-src="images/charL4.jpg" src="images/character4.png" alt="캐릭터4">
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="modal">
    <img src="" alt="">
  </div>
</body>
</html>
