<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신경현 포트폴리오</title>
  <link href="images/favicon.ico" rel="icon">
  <link href="css/style.css" rel="stylesheet">
  <script defer src="js/script.js"></script>
  <script defer src="js/thumbnail-effects.js"></script>
</head>

<body>
  <main id="photoshop">
    <a class="re-btn" href="index.html">&larr; </a>
    <section class="thumbnail">
      <div class="container">
        <h1>썸네일</h1>
        <div class="box-group">
          <div class="box">
            <h2>다큐멘터리</h2>
            <img src="images/photo1.png" alt="썸네일1">
          </div>
          <div class="box">
            <h2>미스터리 범죄</h2>
            <img src="images/photo2.png" alt="썸네일2">
          </div>
          <div class="box">
            <h2>여행</h2>
            <img src="images/photo3.png" alt="썸네일3">
          </div>
          <div class="box">
            <h2>게임</h2>
            <img src="images/photo4.png" alt="썸네일4">
          </div>
          <div class="box">
            <h2>영화 리뷰</h2>
            <img src="images/photo5.png" alt="썸네일5">
          </div>
          <div class="box">
            <h2>AI</h2>
            <img src="images/photo6.png" alt="썸네일6">
          </div>
          <div class="box">
            <h2>IT 제품 리뷰</h2>
            <img src="images/photo7.png" alt="썸네일7">
          </div>
        </div>
      </div>
    </section>
    <section class="poster">
      <div class="container">
        <h1>포스터</h1>
        <div class="box-group">
          <div class="box">
            <h2>햄버거 포스터1</h2>
            <img data-src="images/photoL1.png" src="images/photo8.png" alt="썸네일8">
            <p>클릭하여 원본 소스 보기</p>
          </div>
          <div class="box">
            <h2>햄버거 포스터2</h2>
            <img data-src="images/photoL2.png" src="images/photo9.png" alt="썸네일9">
            <p>클릭하여 원본 소스 보기</p>
          </div>
          <div class="box">
            <h2>햄버거 포스터3</h2>
            <img data-src="images/photoL3.png" src="images/photo10.png" alt="썸네일10">
            <p>클릭하여 원본 소스 보기</p>
          </div>
          <div class="box">
            <h2>영화 포스터</h2>
            <img data-src="images/photoL4.png" src="images/photo11.png" alt="썸네일11">
            <p>클릭하여 원본 소스 보기</p>
          </div>
          <div class="box">
            <h2>학교 홍보 포스터</h2>
            <img data-src="images/photoL5.png" src="images/photo12.png" alt="썸네일12">
            <p>클릭하여 원본 소스 보기</p>
          </div>
        </div>
      </div>
    </section>
    <section class="comp">
      <div class="container">
        <h1>합성</h1>
        <div class="box-group">
          <div class="box">
            <h2>에펠탑에 서있는 남성</h2>
            <img data-src="images/comp1.png" src="images/photo13.png" alt="썸네일13">
            <p>클릭하여 원본 소스 보기</p>
          </div>
          <div class="box">
            <h2>배에 앉은 남성</h2>
            <img data-src="images/comp2.png" src="images/photo14.png" alt="썸네일14">
            <p>클릭하여 원본 소스 보기</p>
          </div>
          <div class="box">
            <h2>공룡 합성</h2>
            <img data-src="images/comp3.png" src="images/photo15.png" alt="썸네일15">
            <p>클릭하여 원본 소스 보기</p>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="modal">
    <img src="" alt="">
  </div>
</body>

</html>
